name: Capture uImposition screenshots

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: Optional comma-separated scenario IDs; empty runs all scenarios
        required: false
        type: string
  pull_request:
    paths:
      - index.html
      - "*.css"
      - VERSION.json
      - src/**
      - data/**
      - tools/screenshots/**
      - tools/news/**
      - news/**
      - archive/development/**
      - .github/workflows/capture-screenshots.yml
      - .github/workflows/prepare-release-news.yml

permissions:
  contents: read

jobs:
  capture:
    name: Real Chromium screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SCREENSHOT_SCENARIOS: ${{ inputs.scenarios || '' }}
      SCREENSHOT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install pinned screenshot dependencies
        working-directory: tools/screenshots
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        working-directory: tools/screenshots
        run: npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1

      - name: Install PDF verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Capture factual screenshots and downloads
        id: capture
        continue-on-error: true
        working-directory: tools/screenshots
        shell: bash
        run: |
          set -o pipefail
          npm run capture 2>&1 | tee ../../capture.log

      - name: Verify and render downloaded PDFs
        if: steps.capture.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pdfs=(artifacts/screenshots/*.pdf)
          if (( ${#pdfs[@]} == 0 )); then
            echo "No PDF downloads were produced by the selected scenarios."
            exit 0
          fi

          for pdf in "${pdfs[@]}"; do
            base="$(basename "$pdf" .pdf)"
            info="artifacts/screenshots/${base}.pdfinfo.txt"
            render_dir="artifacts/screenshots/pdf-renders/${base}"
            mkdir -p "$render_dir"

            pdfinfo "$pdf" | tee "$info"
            pages="$(awk '/^Pages:/ {print $2}' "$info")"
            if [[ ! "$pages" =~ ^[1-9][0-9]*$ ]]; then
              echo "Could not determine a positive page count for $pdf"
              exit 1
            fi

            pdftoppm -png -r 120 "$pdf" "$render_dir/page"
            rendered="$(find "$render_dir" -maxdepth 1 -type f -name 'page-*.png' | wc -l)"
            if [[ "$rendered" -ne "$pages" ]]; then
              echo "Rendered $rendered pages but pdfinfo reports $pages for $pdf"
              exit 1
            fi
            echo "Verified and rendered $pages pages from $pdf"
          done

      - name: Upload screenshot, PDF and diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: uimposition-screenshots-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            capture.log
            artifacts/screenshots/
            tools/screenshots/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on capture error
        if: steps.capture.outcome != 'success'
        run: exit 1

  diagnostics:
    name: Screenshot diagnostic summary
    if: always()
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - name: Download diagnostic artifact
        uses: actions/download-artifact@v5
        with:
          pattern: uimposition-screenshots-*
          merge-multiple: true

      - name: Show concise Playwright result
        shell: bash
        run: |
          if [ -f capture.log ]; then
            tail -n 100 capture.log
          else
            echo "capture.log was not produced"
          fi
