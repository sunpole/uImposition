name: Patch compact mobile hero

on:
  push:
    branches:
      - ux/mobile-compact-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/mobile-compact-foundation
          fetch-depth: 0

      - name: Patch mobile hero and collapsed settings label
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'index.html',
              '<h1>Реальный заказ превращается в проверенные производственные планы.</h1>\n      <p>Все допустимые варианты внутри текущей области остаются в каталоге. Оператор выбирает любой план, получает его схемы, отчёт и PDF, а порядок целей меняет рекомендацию без повторной генерации геометрии.</p>',
              '<h1><span class="hero-wide">Реальный заказ превращается в проверенные производственные планы.</span><span class="hero-compact">Расчёт офсетных монтажей</span></h1>\n      <p><span class="hero-wide">Все допустимые варианты внутри текущей области остаются в каталоге. Оператор выбирает любой план, получает его схемы, отчёт и PDF, а порядок целей меняет рекомендацию без повторной генерации геометрии.</span><span class="hero-compact">Введите лист, изделие, заказ и цены. Все найденные варианты остаются доступными.</span></p>',
          )
          replace_once(
              'index.html',
              '<h1>Real user orders now produce validated production plans.</h1>\n      <p>Every feasible plan inside the current scope remains in the catalog. The operator selects any plan, exports its schemes and report, and reorders objectives without regenerating geometry.</p>',
              '<h1><span class="hero-wide">Real user orders now produce validated production plans.</span><span class="hero-compact">Offset imposition calculator</span></h1>\n      <p><span class="hero-wide">Every feasible plan inside the current scope remains in the catalog. The operator selects any plan, exports its schemes and report, and reorders objectives without regenerating geometry.</span><span class="hero-compact">Enter the sheet, product, order and prices. Every found variant remains available.</span></p>',
          )

          css = Path('styles.css')
          text = css.read_text()
          marker = '/* M7.6 compact mobile hero refinement */'
          if marker in text:
              raise SystemExit('styles.css: refinement marker already present')
          text = text.rstrip() + '''\n\n/* M7.6 compact mobile hero refinement */\n.hero-compact { display: none; }\n\n@media (max-width: 700px) {\n  .hero { padding: 8px 8px 20px; }\n  .nav { margin-bottom: 10px; }\n  .eyebrow { margin: 0; font-size: .56rem; }\n  h1 { margin: 3px 0 6px; font-size: 1.38rem; line-height: 1.03; letter-spacing: -.025em; }\n  .hero__content > p:last-child { font-size: .72rem; line-height: 1.28; }\n  .hero-wide { display: none; }\n  .hero-compact { display: inline; }\n\n  .settings-panel.is-collapsed {\n    width: calc(100% - 12px);\n    max-height: none;\n    overflow: hidden;\n  }\n  .settings-panel.is-collapsed .settings-toggle__text { display: inline; }\n  .settings-panel.is-collapsed .settings-toggle {\n    width: 100%;\n    justify-content: flex-start;\n    border-bottom: 0;\n  }\n}\n''' + '\n'
          css.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html styles.css
          git commit -m "UX: shorten the mobile hero and label collapsed settings"
          git push origin HEAD:ux/mobile-compact-foundation
