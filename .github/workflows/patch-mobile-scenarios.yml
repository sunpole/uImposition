name: Patch mobile scenario interactions

on:
  push:
    branches:
      - ux/mobile-compact-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/mobile-compact-foundation
          fetch-depth: 0

      - name: Patch threshold and mobile scenarios
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app = Path('src/app.js')
          text = app.read_text()
          old = 'window.matchMedia("(max-width: 900px)").matches'
          new = 'window.matchMedia("(max-width: 620px)").matches'
          if text.count(old) != 1:
              raise SystemExit(f'app threshold: expected one match, found {text.count(old)}')
          app.write_text(text.replace(old, new, 1))

          paths = [
              'tools/screenshots/scenarios/m7-user-order-plan-catalog-mobile.json',
              'tools/screenshots/scenarios/m7-user-selected-plan-details-mobile.json',
              'tools/screenshots/scenarios/m7-objective-priority-editor-mobile.json',
          ]
          for path in paths:
              file = Path(path)
              data = json.loads(file.read_text())
              actions = data.get('beforeScreenshot')
              if not isinstance(actions, list):
                  raise SystemExit(f'{path}: beforeScreenshot is not a list')
              if any(action.get('selector') == '#settingsToggle' for action in actions):
                  raise SystemExit(f'{path}: settings toggle action already present')
              actions.insert(0, {'action': 'click', 'selector': '#settingsToggle'})
              file.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js tools/screenshots/scenarios/m7-user-order-plan-catalog-mobile.json tools/screenshots/scenarios/m7-user-selected-plan-details-mobile.json tools/screenshots/scenarios/m7-objective-priority-editor-mobile.json
          git commit -m "Test: open compact mobile settings before data entry"
          git push origin HEAD:ux/mobile-compact-foundation
