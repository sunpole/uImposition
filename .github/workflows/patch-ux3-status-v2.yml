name: Patch UX3 comparison status placement v2

on:
  push:
    branches:
      - ux/comparison-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/comparison-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch status placement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/user-production-comparison-ui.js')
          text = path.read_text()
          old_columns = '''  "pairOverrun",
            "estimatedTotalCost",
            "status",
          ]);'''
          if old_columns not in text:
              old_columns = '''  "pairOverrun",
  "estimatedTotalCost",
  "status",
]);'''
          new_columns = '''  "pairOverrun",
  "estimatedTotalCost",
]);'''
          if old_columns not in text:
              raise SystemExit('columns marker missing')
          text = text.replace(old_columns, new_columns, 1)

          old_copy = '''      element("span", "comparison-plan-copy__proof", proofText(row.values.proofStatus)),
            );'''
          if old_copy not in text:
              old_copy = '''      element("span", "comparison-plan-copy__proof", proofText(row.values.proofStatus)),
    );'''
          new_copy = '''      element("span", "comparison-plan-copy__proof", proofText(row.values.proofStatus)),
      statusBadges(row),
    );'''
          if old_copy not in text:
              raise SystemExit('copy marker missing')
          text = text.replace(old_copy, new_copy, 1)
          path.write_text(text)
          PY
      - name: Commit status placement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/user-production-comparison-ui.js
          git commit -m "UX-3: place plan statuses beside names"
          git push origin HEAD:ux/comparison-workspace
