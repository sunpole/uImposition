name: Patch UX1 application shell wiring

on:
  push:
    branches:
      - ux/application-shell

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/application-shell
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch index and source checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text()
          marker = '  <script type="module" src="src/alternatives-ui.js"></script>\n'
          addition = marker + '  <script type="module" src="src/app-shell-bootstrap.js"></script>\n'
          if 'src/app-shell-bootstrap.js' not in text:
              if marker not in text:
                  raise SystemExit('index marker missing')
              text = text.replace(marker, addition, 1)
              index.write_text(text)

          package = Path('package.json')
          data = json.loads(package.read_text())
          check_source = data['scripts']['check:source']
          marker = 'node --check src/user-production-comparison-table.js'
          insertion = 'node --check src/app-shell-model.js && node --check src/app-shell.js && node --check src/app-shell-bootstrap.js && ' + marker
          if 'src/app-shell-model.js' not in check_source:
              if marker not in check_source:
                  raise SystemExit('package check:source marker missing')
              data['scripts']['check:source'] = check_source.replace(marker, insertion, 1)
              package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "UX-1: wire application shell into runtime"
          git push origin HEAD:ux/application-shell
