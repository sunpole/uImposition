name: Patch UX3 comparison workspace

on:
  push:
    branches:
      - ux/comparison-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/comparison-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch runtime adapter and source checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('src/user-production-plans-ui.js')
          text = path.read_text()

          import_marker = '''import {
            clearUserProductionPlanSet,
            setUserProductionPlanSet,
            subscribeUserProductionPlanRuntime,
          } from "./user-production-plans-runtime.js";
          '''
          comparison_import = import_marker + 'import { renderUserProductionComparisonPanel } from "./user-production-comparison-ui.js";\n'
          if 'renderUserProductionComparisonPanel' not in text:
              if import_marker not in text:
                  raise SystemExit('runtime import marker missing')
              text = text.replace(import_marker, comparison_import, 1)

          state_marker = '''  pricing: window.__uimpositionPricingState?.pricing ?? null,
          };'''
          state_replacement = '''  pricing: window.__uimpositionPricingState?.pricing ?? null,
            selectedPlanId: null,
          };'''
          if 'selectedPlanId: null' not in text:
              if state_marker not in text:
                  raise SystemExit('state marker missing')
              text = text.replace(state_marker, state_replacement, 1)

          style_marker = '''  document.head.append(link);
          }'''
          style_replacement = '''  document.head.append(link);
            if (!$('link[data-user-production-comparison-styles]')) {
              const comparisonLink = document.createElement("link");
              comparisonLink.rel = "stylesheet";
              comparisonLink.href = "user-production-comparison.css";
              comparisonLink.setAttribute("data-user-production-comparison-styles", "");
              document.head.append(comparisonLink);
            }
          }'''
          if 'data-user-production-comparison-styles' not in text:
              if style_marker not in text:
                  raise SystemExit('stylesheet marker missing')
              text = text.replace(style_marker, style_replacement, 1)

          render_marker = '''  const entries = filteredEntries();
            const summary = state.planSet.catalog.summary;'''
          render_replacement = '''  renderUserProductionComparisonPanel(panel, state.planSet, {
              selectedPlanId: state.selectedPlanId,
            });
            return;

            const entries = filteredEntries();
            const summary = state.planSet.catalog.summary;'''
          if 'renderUserProductionComparisonPanel(panel' not in text:
              if render_marker not in text:
                  raise SystemExit('render marker missing')
              text = text.replace(render_marker, render_replacement, 1)

          subscriber_marker = '''subscribeUserProductionPlanRuntime((runtimeSnapshot) => {
            if (runtimeSnapshot.planSet === state.planSet) return;
            state.planSet = runtimeSnapshot.planSet;
            state.error = null;
            if (!state.planSet) state.filter = FILTERS.ALL;
            render();
          });'''
          subscriber_replacement = '''subscribeUserProductionPlanRuntime((runtimeSnapshot) => {
            const planSetChanged = runtimeSnapshot.planSet !== state.planSet;
            const selectionChanged = runtimeSnapshot.selectedPlanId !== state.selectedPlanId;
            if (!planSetChanged && !selectionChanged) return;
            state.planSet = runtimeSnapshot.planSet;
            state.selectedPlanId = runtimeSnapshot.selectedPlanId;
            state.error = null;
            if (!state.planSet) state.filter = FILTERS.ALL;
            render();
          });'''
          if 'const planSetChanged = runtimeSnapshot.planSet !== state.planSet' not in text:
              if subscriber_marker not in text:
                  raise SystemExit('subscriber marker missing')
              text = text.replace(subscriber_marker, subscriber_replacement, 1)

          path.write_text(text)

          package = Path('package.json')
          data = json.loads(package.read_text())
          command = data['scripts']['check:source']
          marker = 'node --check src/user-production-comparison-table.js'
          replacement = marker + ' && node --check src/user-production-comparison-ui.js'
          if 'src/user-production-comparison-ui.js' not in command:
              if marker not in command:
                  raise SystemExit('source-check marker missing')
              data['scripts']['check:source'] = command.replace(marker, replacement, 1)
              package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit comparison wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/user-production-plans-ui.js package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "UX-3: connect the lossless comparison workspace"
          git push origin HEAD:ux/comparison-workspace
