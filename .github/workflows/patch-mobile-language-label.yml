name: Patch mobile settings language label

on:
  push:
    branches:
      - ux/mobile-compact-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/mobile-compact-foundation
          fetch-depth: 0

      - name: Fix active-language label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          text = path.read_text()
          old = '.settings-panel.is-collapsed .settings-toggle__text { display: inline; }'
          new = '.settings-panel.is-collapsed .settings-toggle__text:not([hidden]) { display: inline; }'
          if text.count(old) != 1:
              raise SystemExit(f'expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles.css
          git commit -m "UX: show only the active language in collapsed mobile settings"
          git push origin HEAD:ux/mobile-compact-foundation
