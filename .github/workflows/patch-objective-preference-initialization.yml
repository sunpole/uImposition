name: Patch objective preference initialization

on:
  push:
    branches:
      - m7.5/objective-priority-editor
    paths:
      - .github/workflows/patch-objective-preference-initialization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m7.5/objective-priority-editor
          fetch-depth: 0

      - name: Apply default preference initialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('src/user-production-plans-runtime.js')
          text = runtime.read_text(encoding='utf-8')
          old = '''  if (!objectivePreference) {
            objectivePreference = Object.freeze([...activeOrder]);
            return;
          }'''.replace('    objective', '    objective').replace('    return', '    return').replace('  }', '  }')
          new = '''  if (!objectivePreference) {
            objectivePreference = Object.freeze([...DEFAULT_OBJECTIVE_ORDER]);
          }'''.replace('    objective', '    objective').replace('  }', '  }')
          if old not in text:
              raise SystemExit('objective preference initialization block missing')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/user-objective-preference-persistence.test.js')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'test("cost priority survives temporary removal and restoration of pricing", () => {'
          addition = '''test("pricing introduced after an unpriced calculation enters the default second position", () => {
            clearUserProductionPlanSet();
            resetUserProductionObjectivePreference();

            const withoutPricing = setUserProductionPlanSet(buildPlanSet(false));
            assert.equal(withoutPricing.planSet.catalog.objectiveOrder[0], "physicalSheets");
            assert.equal(withoutPricing.planSet.catalog.objectiveOrder.includes("estimatedTotalCost"), false);

            const withPricing = setUserProductionPlanSet(buildPlanSet(true));
            assert.deepEqual(withPricing.planSet.catalog.objectiveOrder.slice(0, 3), [
              "physicalSheets",
              "estimatedTotalCost",
              "layoutForms",
            ]);

            clearUserProductionPlanSet();
            resetUserProductionObjectivePreference();
          });

          '''.replace('          ', '')
          if addition not in tests:
              if marker not in tests:
                  raise SystemExit('preference test insertion marker missing')
              tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          node --check src/user-production-plans-runtime.js
          node --test tests/user-objective-preference-persistence.test.js tests/user-objective-priority-runtime.test.js

      - name: Commit initialization fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "uImposition patch automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/user-production-plans-runtime.js tests/user-objective-preference-persistence.test.js
          if git diff --cached --quiet; then
            echo "Preference initialization already fixed."
            exit 0
          fi
          git commit -m "M7.5: preserve default cost position when pricing appears"
          git push origin HEAD:m7.5/objective-priority-editor
