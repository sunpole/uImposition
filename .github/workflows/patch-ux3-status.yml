name: Patch UX3 comparison status placement

on:
  push:
    branches:
      - ux/comparison-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/comparison-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch status placement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/user-production-comparison-ui.js')
          text = path.read_text()
          old = '''  "estimatedTotalCost",
            "status",
          ]);'''
          new = '''  "estimatedTotalCost",
          ]);'''
          if old not in text:
              raise SystemExit('main column marker missing')
          text = text.replace(old, new, 1)

          old = '''      element("span", "comparison-plan-copy__proof", proofText(row.values.proofStatus)),
            );
            td.append(copy);'''
          new = '''      element("span", "comparison-plan-copy__proof", proofText(row.values.proofStatus)),
              statusBadges(row),
            );
            td.append(copy);'''
          if old not in text:
              raise SystemExit('label copy marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit status placement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/user-production-comparison-ui.js
          git commit -m "UX-3: place plan statuses beside names"
          git push origin HEAD:ux/comparison-workspace
