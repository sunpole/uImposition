name: Patch user plan selection integration v2

on:
  push:
    branches:
      - m7.5/user-plan-selection-export
    paths:
      - .github/workflows/patch-user-plan-selection-integration-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m7.5/user-plan-selection-export
          fetch-depth: 0

      - name: Apply structural patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return updated

          path = Path('src/user-production-plans-ui.js')
          text = path.read_text(encoding='utf-8')
          runtime_import = '''import {
            clearUserProductionPlanSet,
            setUserProductionPlanSet,
          } from "./user-production-plans-runtime.js";
          '''.replace('          ', '')
          if runtime_import not in text:
              text = replace_once(
                  text,
                  r'(import \{ createUserUniformProductionPlanSet \} from "\./user-uniform-production-plans\.js";\n)',
                  r'\1' + runtime_import,
                  'runtime import',
              )

          text = replace_once(
              text,
              r'(if \(input\.orders\.errors\.length > 0 \|\| input\.orders\.pagePairs\.length === 0\) \{\n\s+state\.planSet = null;\n)(\s+state\.error = null;)',
              r'\1      clearUserProductionPlanSet();\n\2',
              'clear invalid orders',
          )
          text = replace_once(
              text,
              r'(if \(input\.orders\.pagePairs\.length > MAX_INTERACTIVE_PAGE_PAIRS\) \{\n\s+state\.planSet = null;\n)(\s+state\.error = new RangeError\(t\("tooManyPairs"\)\);)',
              r'\1      clearUserProductionPlanSet();\n\2',
              'clear excessive orders',
          )
          text = replace_once(
              text,
              r'(if \(frontColors === null \|\| backColors === null\) \{\n\s+state\.planSet = null;\n)(\s+state\.error = new RangeError\(t\("waitingColors"\)\);)',
              r'\1      clearUserProductionPlanSet();\n\2',
              'clear invalid colors',
          )
          text = replace_once(
              text,
              r'(state\.planSet = createUserUniformProductionPlanSet\(\{.*?\n\s+\}\);\n)(\s+state\.error = null;)',
              r'\1    setUserProductionPlanSet(state.planSet);\n\2',
              'publish plan set',
              re.S,
          )
          text = replace_once(
              text,
              r'(\} catch \(error\) \{\n\s+state\.planSet = null;\n)(\s+state\.error = error;)',
              r'\1    clearUserProductionPlanSet();\n\2',
              'clear failed calculation',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/user-production-plan-details-ui.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              r'button\.classList\.toggle\("button--quiet", !selected\);\n\s+button\.textContent = selected \? t\("selected"\) : t\("select"\);\n\s+button\.setAttribute\("aria-pressed", String\(selected\)\);',
              '''button.classList.toggle("button--quiet", !selected);
              const label = selected ? t("selected") : t("select");
              if (button.textContent !== label) button.textContent = label;
              button.setAttribute("aria-pressed", String(selected));'''.replace('              ', '    '),
              'stable selection label',
          )
          text = replace_once(
              text,
              r'subscribeUserProductionPlanRuntime\(\(snapshot\) => \{\n\s+runtimeSnapshot = snapshot;\n\s+render\(\);\n\}\);',
              '''subscribeUserProductionPlanRuntime((snapshot) => {
                const selectionChanged = snapshot.selectedPlanId !== runtimeSnapshot.selectedPlanId;
                runtimeSnapshot = snapshot;
                if (selectionChanged) {
                  exportStatusKey = "exportReady";
                  exportStatusDetail = "";
                }
                render();
              });'''.replace('              ', ''),
              'selection status reset',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '  <script type="module" src="src/user-production-plans-ui.js"></script>\n'
          addition = '  <script type="module" src="src/user-production-plan-details-ui.js"></script>\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('index script marker missing')
              text = text.replace(marker, marker + addition, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('package.json')
          text = path.read_text(encoding='utf-8')
          marker = 'node --check src/user-production-plans-ui.js'
          addition = marker + ' && node --check src/user-production-plans-runtime.js && node --check src/user-production-plan-details-ui.js'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('package marker missing')
              text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check src/user-production-plans-ui.js
          node --check src/user-production-plans-runtime.js
          node --check src/user-production-plan-details-ui.js
          node --test tests/user-production-plans-runtime.test.js

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "uImposition patch automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/user-production-plans-ui.js src/user-production-plan-details-ui.js index.html package.json
          if git diff --cached --quiet; then
            echo "Selection integration already applied."
            exit 0
          fi
          git commit -m "M7.5: connect explicit plan selection and details UI"
          git push origin HEAD:m7.5/user-plan-selection-export
