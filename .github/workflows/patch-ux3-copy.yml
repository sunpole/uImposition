name: Patch UX3 comparison copy

on:
  push:
    branches:
      - ux/comparison-workspace

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/comparison-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch user-facing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/user-production-comparison-ui.js')
          text = path.read_text()
          replacements = {
            'shown: "Показано",': 'shown: "показано",\n    variants: "варианта(ов)",\n    exactScope: "Полный набор внутри текущей области: fitting 0°/90° × две uniform plan-family. Это не глобальный перебор mixed-layout и всех последовательностей форм.",',
            'shown: "Shown",': 'shown: "shown",\n    variants: "variant(s)",\n    exactScope: "Complete inside the current scope: fitting 0°/90° × two uniform plan families. This is not a global enumeration of mixed layouts or every form sequence.",',
            'heading.append(headingCopy, badge(`${tableModel.allRows.length}`, "count"));': 'heading.append(headingCopy, badge(`${tableModel.allRows.length} ${t("variants")}`, "count"));',
            'element("span", "", t("retained")),': 'element("span", "", t("exactScope")),\n    element("span", "", t("retained")),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'marker missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit copy alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/user-production-comparison-ui.js
          git commit -m "UX-3: preserve lossless catalog scope copy"
          git push origin HEAD:ux/comparison-workspace
