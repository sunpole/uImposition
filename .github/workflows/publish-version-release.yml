name: Publish uImposition version release

# Updating this workflow intentionally retries every missing manifest checkpoint.
on:
  push:
    branches: [main]
    paths:
      - 'archive/development/*/release.json'
      - '.github/workflows/publish-version-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish every missing version checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t manifests < <(find archive/development -mindepth 2 -maxdepth 2 -name release.json -type f | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No release manifests found."
            exit 0
          fi

          for manifest in "${manifests[@]}"; do
            eval "$(node --input-type=module - "$manifest" <<'NODE'
          import fs from 'node:fs';
          const manifestPath = process.argv[2];
          const data = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const quote = (value) => `'${String(value).replaceAll("'", "'\\''")}'`;
          console.log(`VERSION=${quote(data.version)}`);
          console.log(`TAG=${quote(data.tag)}`);
          console.log(`TITLE=${quote(data.title)}`);
          console.log(`PRERELEASE=${quote(Boolean(data.prerelease) ? 'true' : 'false')}`);
          console.log(`SOURCE_COMMIT=${quote(data.sourceCommit)}`);
          console.log(`RELEASE_COMMIT=${quote(data.releaseCommit ?? '')}`);
          console.log(`PATCHNOTE=${quote(data.patchnote)}`);
          console.log(`IMAGE=${quote(data.image)}`);
          console.log(`ARCHIVE=${quote(data.archive)}`);
          NODE
          )"

            if ! git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"; then
              echo "Skip $VERSION: source commit $SOURCE_COMMIT is not part of $GITHUB_SHA."
              continue
            fi

            target_commit="${RELEASE_COMMIT:-$GITHUB_SHA}"
            if ! git merge-base --is-ancestor "$target_commit" "$GITHUB_SHA"; then
              echo "Release commit $target_commit for $VERSION is not part of $GITHUB_SHA."
              exit 1
            fi

            for required in "$PATCHNOTE" "$IMAGE" "$ARCHIVE"; do
              if [ ! -f "$required" ]; then
                echo "Required release file is missing: $required"
                exit 1
              fi
            done

            release_exists=false
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release_exists=true
            fi

            remote_tag_sha="$(git ls-remote origin "refs/tags/${TAG}" | head -n1 | cut -f1)"
            remote_tag_commit="$(git ls-remote origin "refs/tags/${TAG}^{}" | head -n1 | cut -f1)"
            if [ -z "$remote_tag_commit" ]; then
              remote_tag_commit="$remote_tag_sha"
            fi

            rollback_branch="release/v${VERSION}"
            remote_branch_sha="$(git ls-remote origin "refs/heads/${rollback_branch}" | cut -f1)"

            if [ "$release_exists" = "true" ]; then
              if [ -z "$remote_tag_sha" ] || [ -z "$remote_branch_sha" ]; then
                echo "GitHub Release $TAG exists but its tag or rollback branch is missing."
                exit 1
              fi
              echo "GitHub Release $TAG already exists; checkpoint is unchanged."
              continue
            fi

            if [ -z "$remote_branch_sha" ]; then
              git push origin "$target_commit:refs/heads/${rollback_branch}"
              echo "Created rollback branch ${rollback_branch} at ${target_commit}."
            elif [ "$remote_branch_sha" = "$target_commit" ]; then
              echo "Rollback branch ${rollback_branch} already matches ${target_commit}."
            elif [ -n "$remote_tag_sha" ]; then
              echo "Rollback branch differs after tag publication; refusing to move it."
              exit 1
            elif git merge-base --is-ancestor "$remote_branch_sha" "$target_commit"; then
              git push origin "$target_commit:refs/heads/${rollback_branch}"
              echo "Fast-forwarded unpublished rollback branch ${rollback_branch} to ${target_commit}."
            else
              echo "Rollback branch ${rollback_branch} is not an ancestor of ${target_commit}; refusing to rewrite it."
              exit 1
            fi

            if [ -z "$remote_tag_sha" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${TAG}" \
                -f sha="$target_commit" >/dev/null
              remote_tag_sha="$target_commit"
              remote_tag_commit="$target_commit"
              echo "Created immutable tag ${TAG} at ${target_commit} through the GitHub API."
            elif [ "$remote_tag_commit" != "$target_commit" ]; then
              echo "Tag ${TAG} already points to ${remote_tag_commit}; refusing to move it to ${target_commit}."
              exit 1
            else
              echo "Tag ${TAG} already matches ${target_commit}."
            fi

            release_args=(
              "$TAG"
              "$ARCHIVE#Development evidence archive"
              "$IMAGE#Focused feature screenshot"
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --title "$TITLE"
              --notes-file "$PATCHNOTE"
            )
            if [ "$PRERELEASE" = "true" ]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
            echo "Published GitHub Release ${TAG}."
          done
