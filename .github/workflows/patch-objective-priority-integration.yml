name: Patch objective priority integration

on:
  push:
    branches:
      - m7.5/objective-priority-editor
    paths:
      - .github/workflows/patch-objective-priority-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m7.5/objective-priority-editor
          fetch-depth: 0

      - name: Apply exact integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/user-production-plans-ui.js')
          source = path.read_text(encoding='utf-8')
          old_import = '''import {
            clearUserProductionPlanSet,
            setUserProductionPlanSet,
          } from "./user-production-plans-runtime.js";
          '''.replace('          ', '')
          new_import = '''import {
            clearUserProductionPlanSet,
            setUserProductionPlanSet,
            subscribeUserProductionPlanRuntime,
          } from "./user-production-plans-runtime.js";
          '''.replace('          ', '')
          if new_import not in source:
              if old_import not in source:
                  raise SystemExit('runtime import block not found')
              source = source.replace(old_import, new_import, 1)

          old_tail = '''ensureStylesheet();
          ensureColorControls();
          ensurePanel();
          attachListeners();
          calculate();
          '''.replace('          ', '')
          new_tail = '''ensureStylesheet();
          ensureColorControls();
          ensurePanel();
          attachListeners();
          calculate();
          subscribeUserProductionPlanRuntime((runtimeSnapshot) => {
            if (runtimeSnapshot.planSet === state.planSet) return;
            state.planSet = runtimeSnapshot.planSet;
            state.error = null;
            if (!state.planSet) state.filter = FILTERS.ALL;
            render();
          });
          '''.replace('          ', '')
          if new_tail not in source:
              if old_tail not in source:
                  raise SystemExit('plans UI tail not found')
              source = source.replace(old_tail, new_tail, 1)
          path.write_text(source, encoding='utf-8')

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          script_marker = '  <script type="module" src="src/user-production-plans-ui.js"></script>\n'
          priority_script = '  <script type="module" src="src/user-objective-priority-ui.js"></script>\n'
          if priority_script not in html:
              if script_marker not in html:
                  raise SystemExit('index script marker not found')
              html = html.replace(script_marker, script_marker + priority_script, 1)

          old_ru = '<div data-lang="ru"><p><strong>Работает:</strong> пользовательские размеры листа и изделия, строки заказа, общая цветность и рабочий прайс теперь строят проверенные production plans для обеих fitting uniform-grid ориентаций. Все планы сохраняются; Pareto, рекомендация и доминирование являются метками, а не удалением вариантов.</p><p><strong>Граница:</strong> полный набор относится к текущей явно ограниченной области — 0°/90° и две plan-family. Mixed-format, смешанные повороты, произвольные последовательности форм и общий work-and-turn search ещё не заявлены.</p><p><strong>Следом:</strong> расширять генератор семей планов и подключать выбранный пользовательский вариант к подробным схемам и PDF.</p></div>'
          new_ru = '<div data-lang="ru"><p><strong>Работает:</strong> пользовательские параметры строят проверенные production plans, сохраняют все варианты и позволяют оператору менять порядок целей без повторной генерации. Любой вариант можно выбрать, раскрыть в реальные схемы и production report и экспортировать в PDF.</p><p><strong>Граница:</strong> полный набор относится к текущей явно ограниченной области — fitting 0°/90° и две plan-family. Mixed-format, смешанные повороты, произвольные последовательности форм и общий work-and-turn search ещё не заявлены.</p><p><strong>Следом:</strong> расширять семейства планов и bounded search, сохраняя lossless-каталог и явный операторский выбор.</p></div>'
          old_en = '<div data-lang="en" hidden><p><strong>Working:</strong> user sheet/product sizes, order rows, shared colors, and operator pricing now build validated production plans for both fitting uniform-grid orientations. Every plan is retained; Pareto, recommendation, and domination are annotations rather than deletion.</p><p><strong>Boundary:</strong> completeness applies only to the explicitly bounded 0°/90° × two-family scope. Mixed formats, mixed rotations, arbitrary form sequences, and general work-and-turn search are not claimed yet.</p><p><strong>Next:</strong> expand plan families and connect the operator-selected user plan to detailed schemes and PDF export.</p></div>'
          new_en = '<div data-lang="en" hidden><p><strong>Working:</strong> user inputs build validated production plans, retain every alternative, and let the operator reorder objectives without regenerating geometry. Any variant can be selected, expanded into real schemes and a production report, and exported to PDF.</p><p><strong>Boundary:</strong> completeness applies only to the explicitly bounded fitting 0°/90° × two-family scope. Mixed formats, mixed rotations, arbitrary form sequences, and general work-and-turn search are not claimed yet.</p><p><strong>Next:</strong> expand plan families and bounded search while preserving the lossless catalog and explicit operator selection.</p></div>'
          if old_ru not in html or old_en not in html:
              raise SystemExit('roadmap boundary block not found')
          html = html.replace(old_ru, new_ru, 1).replace(old_en, new_en, 1)
          path.write_text(html, encoding='utf-8')

          path = Path('package.json')
          package = path.read_text(encoding='utf-8')
          marker = 'node --check src/user-production-plans-runtime.js'
          addition = marker + ' && node --check src/user-objective-priority.js && node --check src/user-objective-priority-ui.js'
          if addition not in package:
              if marker not in package:
                  raise SystemExit('package marker not found')
              package = package.replace(marker, addition, 1)
          path.write_text(package, encoding='utf-8')
          PY

          node --check src/user-objective-priority.js
          node --check src/user-objective-priority-ui.js
          node --check src/user-production-plans-runtime.js
          node --check src/user-production-plans-ui.js
          node --test tests/user-objective-priority.test.js tests/user-objective-priority-runtime.test.js

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "uImposition patch automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/user-production-plans-ui.js index.html package.json
          if git diff --cached --quiet; then
            echo "Objective priority integration already applied."
            exit 0
          fi
          git commit -m "M7.5: connect objective editor to existing plan catalog"
          git push origin HEAD:m7.5/objective-priority-editor
