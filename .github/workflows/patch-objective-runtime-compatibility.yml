name: Patch objective runtime compatibility

on:
  push:
    branches:
      - m7.5/objective-priority-editor
    paths:
      - .github/workflows/patch-objective-runtime-compatibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: m7.5/objective-priority-editor
          fetch-depth: 0

      - name: Patch catalog compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/user-production-plans-runtime.js')
          text = path.read_text(encoding='utf-8')
          old = '''function applyStoredPreference(value) {
            const order = preferredActiveOrder(value);
            const current = value.catalog.objectiveOrder;
            const unchanged = current.length === order.length
              && current.every((objectiveId, index) => objectiveId === order[index]);
            return unchanged ? value : rerankUserProductionPlanSet(value, order);
          }'''.replace('          ', '')
          new = '''function applyStoredPreference(value) {
            const current = value?.catalog?.objectiveOrder;
            const objectiveIds = value?.catalog?.objectiveIds;
            if (!Array.isArray(current) || !Array.isArray(objectiveIds)) return value;

            const order = preferredActiveOrder(value);
            const unchanged = current.length === order.length
              && current.every((objectiveId, index) => objectiveId === order[index]);
            return unchanged ? value : rerankUserProductionPlanSet(value, order);
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('applyStoredPreference block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check src/user-production-plans-runtime.js
          node --test tests/user-production-plans-runtime.test.js tests/user-objective-priority-runtime.test.js tests/user-objective-preference-persistence.test.js

      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "uImposition patch automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/user-production-plans-runtime.js
          if git diff --cached --quiet; then
            echo "Runtime compatibility already fixed."
            exit 0
          fi
          git commit -m "M7.5: keep selection runtime compatible with minimal plan sets"
          git push origin HEAD:m7.5/objective-priority-editor
