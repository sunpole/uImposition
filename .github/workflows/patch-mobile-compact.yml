name: Patch mobile compact foundation

on:
  push:
    branches:
      - ux/mobile-compact-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/mobile-compact-foundation
          fetch-depth: 0

      - name: Apply guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/app.js",
              "function attachListeners() {",
              '''function initializeResponsiveSettingsPanel() {
            const compactViewport = window.matchMedia("(max-width: 900px)").matches;
            ui.settingsPanel.classList.toggle("is-collapsed", compactViewport);
            ui.settingsToggle.ariaExpanded = String(!compactViewport);
          }

          function attachListeners() {''',
          )
          replace_once(
              "src/app.js",
              "populatePresets();\napplyDefaults();\nattachListeners();",
              "populatePresets();\napplyDefaults();\ninitializeResponsiveSettingsPanel();\nattachListeners();",
          )

          blocks = {
            "styles.css": r'''

          /* M7.6 mobile compact foundation */
          @media (max-width: 700px) {
            :root { font-size: 14px; line-height: 1.35; }
            .hero { padding: 10px 10px 30px; }
            .nav { margin-bottom: 18px; }
            .brand { gap: 6px; padding: 4px 6px; margin-left: -6px; }
            .brand__name { font-size: 1rem; }
            .brand__version { font-size: .62rem; }
            .language-button { padding: 6px 10px; font-size: .75rem; }
            h1 { margin: 4px 0 8px; font-size: clamp(1.72rem, 8.7vw, 2.25rem); line-height: 1; letter-spacing: -.04em; }
            .hero__content > p:last-child { margin: 0; font-size: .84rem; line-height: 1.35; }

            .settings-panel {
              width: calc(100% - 12px);
              max-height: min(68vh, 500px);
              margin: -18px auto 10px;
              border-radius: 10px;
              background: #fff;
              box-shadow: 0 5px 16px rgba(0,0,0,.14);
              backdrop-filter: none;
            }
            .settings-toggle { min-height: 38px; padding: 7px 10px; font-size: .82rem; }
            .settings-panel__content { padding: 9px; gap: 9px; }
            .settings-section-title { font-size: .86rem; }
            .settings-divider { margin: 1px 0; }
            .field { gap: 3px; font-size: .76rem; }
            .field-grid, .four-sides { grid-template-columns: 1fr 1fr; gap: 6px; }
            input, select, textarea { border-radius: 7px; padding: 7px 8px; font-size: .82rem; }
            textarea { min-height: 112px; line-height: 1.35; }
            .check-row { gap: 6px; font-size: .78rem; }
            .check-row input { width: 16px; height: 16px; }
            .hint { margin-top: -4px; font-size: .7rem; }
            details { padding-top: 7px; }
            summary { font-size: .78rem; }

            .workspace { width: calc(100% - 12px); margin: 0 auto 24px; gap: 9px; }
            .panel { border-radius: 11px; padding: 11px; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
            .section-heading { gap: 7px; margin-bottom: 11px; }
            .section-heading h2 { margin-top: 0; font-size: 1.13rem; line-height: 1.12; }
            .eyebrow, .section-kicker { font-size: .64rem; letter-spacing: .1em; }
            .status-chip { min-height: 24px; padding: 3px 8px; font-size: .7rem; }

            .result-grid, .result-grid--capacity, .result-grid--m7-status { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
            .metric { min-height: 66px; border-radius: 8px; padding: 7px; }
            .metric span { font-size: .66rem; line-height: 1.2; }
            .metric strong, .milestone-panel .metric strong { font-size: .98rem; line-height: 1.12; }
            .formula-card { margin-top: 8px; padding: 8px 10px; font-size: .75rem; }
            .button-row { gap: 5px; }
            .button { border-radius: 7px; padding: 7px 9px; font-size: .78rem; }
            .error-box { margin-top: 8px; padding: 8px 9px; font-size: .74rem; }

            .candidate-grid { gap: 7px; margin-top: 9px; }
            .candidate-card { border-radius: 9px; padding: 9px; }
            .candidate-card.is-best { border-width: 2px; padding: 8px; }
            .candidate-card strong { font-size: 1.08rem; }
            .candidate-card p { margin: 7px 0 2px; }
            .placement-preview-wrap { margin-top: 12px; }
            .preview-heading h3, .preview-heading p { margin-bottom: 6px; }
            .placement-preview { gap: 3px; padding: 5px; }
            .placement-cell { min-height: 30px; font-size: .66rem; }

            .table-wrap { border-radius: 8px; }
            table { min-width: 520px; }
            th, td { padding: 6px 7px; font-size: .72rem; }
            .empty-state { margin-top: 8px; font-size: .76rem; }
            footer { width: calc(100% - 12px); padding-bottom: 20px; font-size: .72rem; }
          }

          @media (max-width: 355px) {
            .result-grid, .result-grid--capacity, .result-grid--m7-status { grid-template-columns: 1fr; }
            .field-grid { grid-template-columns: 1fr; }
          }
          ''',
            "user-production-plans.css": r'''

          /* M7.6 mobile compact foundation */
          @media (max-width: 620px) {
            .user-production-plans { gap: 8px; }
            .user-production-plans__subtitle { margin-top: 3px; font-size: .76rem; }
            .user-production-plans__status { padding: 7px 8px; font-size: .7rem; line-height: 1.3; }
            .plan-filters { gap: 4px; }
            .plan-filter { flex: 1 1 calc(50% - 2px); padding: 5px 6px; font-size: .7rem; }
            .production-plan-list { gap: 6px; }
            .production-plan-card { border-radius: 9px; padding: 9px; gap: 7px; }
            .production-plan-card.is-recommended { border-width: 2px; padding: 8px; }
            .production-plan-card__heading { gap: 5px; }
            .production-plan-card__heading h3 { font-size: .84rem; line-height: 1.18; }
            .production-plan-card__proof { margin-top: 2px; font-size: .66rem; }
            .production-plan-card__badges { gap: 3px; }
            .plan-badge { min-height: 21px; padding: 2px 6px; font-size: .62rem; }
            .plan-badge--count { min-height: 24px; font-size: .68rem; }
            .production-plan-card__metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
            .plan-metric { border-radius: 6px; padding: 5px; gap: 2px; }
            .plan-metric span { font-size: .58rem; line-height: 1.15; }
            .plan-metric strong { font-size: .78rem; line-height: 1.15; }
            .production-plan-card__footer { gap: 4px 8px; font-size: .64rem; }
            .select-user-plan-button { min-height: 30px; padding: 4px 8px; font-size: .72rem; }
          }

          @media (max-width: 355px) {
            .production-plan-card__metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          }
          ''',
            "user-objective-priority.css": r'''

          /* M7.6 mobile compact foundation */
          @media (max-width: 620px) {
            .user-objective-priority { gap: 6px; }
            .user-objective-priority__subtitle { font-size: .84rem; }
            .user-objective-priority__hint, .objective-drag-hint { font-size: .68rem; line-height: 1.3; }
            .objective-priority-label { margin: 2px 0 -1px; font-size: .66rem; }
            .objective-preset-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
            .objective-preset-button { min-height: 30px; padding: 4px 5px; font-size: .68rem; }
            .objective-priority-list { gap: 3px; }
            .objective-priority-row { grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px; border-radius: 7px; padding: 4px; }
            .objective-priority-position { width: 20px; height: 20px; font-size: .62rem; }
            .objective-priority-copy strong { font-size: .72rem; line-height: 1.12; }
            .objective-priority-copy small { font-size: .58rem; }
            .objective-priority-actions { gap: 3px; }
            .objective-move-button { width: 30px; min-width: 30px; height: 30px; border-radius: 6px; }
            .objective-priority-status { padding: 6px 7px; font-size: .66rem; line-height: 1.3; }
            .objective-hard-constraints summary { font-size: .7rem; }
            .hard-constraint-list { margin-top: 5px; gap: 2px; font-size: .64rem; }
          }

          @media (max-width: 355px) {
            .objective-preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          }
          ''',
            "user-production-plan-details.css": r'''

          /* M7.6 mobile compact foundation */
          @media (max-width: 620px) {
            .selected-user-plan-details { gap: 10px; }
            .selected-plan-summary { gap: 8px; }
            .selected-plan-clear { min-height: 30px; }
            .selected-plan-summary__metrics,
            .selected-plan-report__metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
            .selected-plan-summary__metrics .metric,
            .selected-plan-report__metrics .metric { min-height: 62px; padding: 6px; }
            .selected-plan-summary__metrics .metric strong,
            .selected-plan-report__metrics .metric strong { font-size: .82rem; }
            .selected-plan-meta { font-size: .66rem; }
            .production-plan-card.is-operator-selected { outline-width: 2px; outline-offset: 1px; }
            .selected-plan-section { padding-top: 11px; gap: 7px; }
            .selected-plan-section > h3 { font-size: .95rem; }
            .selected-plan-section > p { font-size: .72rem; }
            .selected-plan-preview-note { padding: 7px 8px; font-size: .68rem; }
            .selected-plan-details-block { border-radius: 8px; }
            .selected-plan-details-block > summary { padding: 8px 9px; }
            .selected-plan-export__actions { gap: 5px; }
          }

          @media (max-width: 355px) {
            .selected-plan-summary__metrics,
            .selected-plan-report__metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          }
          ''',
          }

          for path, block in blocks.items():
              file = Path(path)
              text = file.read_text()
              marker = "/* M7.6 mobile compact foundation */"
              if marker in text:
                  raise SystemExit(f"{path}: marker already present")
              file.write_text(text.rstrip() + block + "\n")
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js styles.css user-production-plans.css user-objective-priority.css user-production-plan-details.css
          git commit -m "UX: compact the mobile interface foundation"
          git push origin HEAD:ux/mobile-compact-foundation
